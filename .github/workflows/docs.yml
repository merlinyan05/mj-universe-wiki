name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation and repository boundaries
        run: python3 scripts/check_docs.py
      - name: Test image contributions and documentation rules
        run: python3 -m unittest discover -s tests -v
